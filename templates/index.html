<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CIFAR-10 Image Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        input[type="file"] {
            margin: 25px 0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #f0f0f0;
        }

        .result h2 {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🖼️ CIFAR-10 Image Classifier</h1>

    <p>Upload an image and let the CNN model predict its class.</p>

    <form action="/predict" method="post" enctype="multipart/form-data">

        <input
            type="file"
            name="file"
            accept="image/*"
            required
        >

        <br>

        <button type="submit">
            Predict Image
        </button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>Prediction: {{ prediction }}</h2>

        <p>Confidence: {{ confidence }}%</p>

    </div>

    {% endif %}

</div>

</body>
</html>
